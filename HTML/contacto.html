<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - ERA Tecnológica</title>
    <meta name="author" content="Adrián Blanco">
    <meta name="author" content="Erik Corraliza">
    <meta name="author" content="Raúl Sanguino">
    <link rel="stylesheet" href="../CSS/contacto.css">
</head>
<body>
    <header>
        <h1 align="center">Contacta con nosotros</h1>
    </header>
    <main>
        <form id="formularioSolicitudContacto">
            <fieldset id="fieldset-formularioSolicitudContacto">
                <legend>Formulario de contacto</legend>
                <fieldset id="fieldset-formularioDatosUsuario">
                    <legend>Datos de usuario</legend>

                        <label for="nombreCompleto">Nombre completo: </label>
                        <input name="nombreCompleto" id="nombreCompleto" type="text"><br><br>

                        <label for="correo">Correo electronico: </label>
                        <input name="correo" id="correo" type="email" placeholder="ejemplo@gmail.com"><br><br>

                        <laber for="opinion" id="opinion">¿Qué opinas de nuestra web?</label>
                        <select name="opinion" id="opinion">
                            <option value="muyBuena">Muy buena</option>
                            <option value="buena">Buena</option>
                            <option value="regular">Regular</option>
                            <option value="mala">Mala</option>
                        </select>

                </fieldset>
                        <div id="solicitudContacto">
                            <label id="solicitudContacto" for="solicitudContacto">Cuerpo del mensaje:</label>
                            <br>
                            <center>
                                <textarea id="solicitudContacto" style="width: 80%; height: 120px;"></textarea>
                            </center>
                        </div>
                        <div id="Botones" align="center">
                            <button name="enviarInformacionRegistro">Enviar</button>
                            <button name="limpiarInformacionRegistro">Limpiar</button>
                        </div>
                    
                </fieldset>
            </fieldset>
        </form>
    </main>
</body>
</html>
